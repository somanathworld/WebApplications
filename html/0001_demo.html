<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Button with Progressing Outline</title>
    <style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
    margin: 0;
}

.button-container {
    text-align: center;
}

.animated-button {
    background: linear-gradient(45deg, #ff6b6b, #f06595, #cc5de8, #845ef7, #5c7cfa, #339af0, #22b8cf, #20c997, #51cf66, #94d82d, #fcc419, #ff922b);
    background-size: 300% 300%;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 50px;
    transition: transform 0.3s;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    animation: gradientAnimation 5s ease infinite;
}

@keyframes gradientAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.animated-button:hover {
    transform: scale(1.1);
}

.animated-button:active {
    transform: scale(0.9);
}

.progress-bar {
    width: 0;
    height: 5px;
    background-color: #6200ea;
    margin-top: 20px;
    border-radius: 5px;
    transition: width 2s;
}

.animated-button::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border-radius: 50px;
    border: 2px solid transparent;
    background: linear-gradient(45deg, #ff6b6b, #f06595, #cc5de8, #845ef7, #5c7cfa, #339af0, #22b8cf, #20c997, #51cf66, #94d82d, #fcc419, #ff922b);
    background-size: 300% 300%;
    z-index: -1;
    animation: borderAnimation 5s linear infinite;
}

@keyframes borderAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Responsive Styles */
@media (max-width: 768px) {
    .animated-button {
        padding: 12px 24px;
        font-size: 16px;
    }

    .progress-bar {
        height: 4px;
    }
}

@media (max-width: 480px) {
    .animated-button {
        padding: 10px 20px;
        font-size: 14px;
    }

    .progress-bar {
        height: 3px;
    }
}
    
    </style>
</head>
<body>
    <div class="button-container">
        <button class="animated-button" onclick="startProgress()">Click Me!</button>
        <h1>Hellow moto</h1>
    </div>
    <script>
    function startProgress() {
        const progressBar = document.getElementById('progress-bar');
        progressBar.style.width = '100%';
        setTimeout(() => {
            progressBar.style.width = '0';
        }, 2000);
    }
    </script>
</body>
</html>
